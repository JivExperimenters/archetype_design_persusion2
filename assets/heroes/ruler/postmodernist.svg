  <text x="76" y="292" fill="#202c32" font-family="Arial,sans-serif" font-size="68" font-weight="900">Decide clearly.</text>
  <text x="76" y="366" fill="#e75848" font-family="Arial,sans-serif" font-size="68" font-weight="900">Lead consistently.</text>
  <text x="80" y="422" fill="#4d5959" font-family="Arial,sans-serif" font-size="21">A practical framework for making the next decision clear.</text>
  <rect x="80" y="466" width="242" height="60" rx="4" fill="#202c32"/>
  <text x="201" y="504" text-anchor="middle" fill="#f5f0df" font-family="Arial,sans-serif" font-size="16" font-weight="700">REVIEW THE FRAMEWORK</text>
  <text x="1122" y="615" text-anchor="end" fill="#4d5959" font-family="Arial,sans-serif" font-size="14">ORIGINAL GENERATED DESIGN · MEMPHIS-INSPIRED</text>
