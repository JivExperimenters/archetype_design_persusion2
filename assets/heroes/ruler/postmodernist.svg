<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Northline, postmodernist Ruler hero</title>
  <desc id="desc">A Memphis-inspired planning toolkit hero that combines precise grids and bold geometric blocks with a clear headline and action button.</desc>
  <rect width="1200" height="675" fill="#f5f0df"/>
  <rect y="0" width="1200" height="18" fill="#17847c"/>
  <text x="78" y="82" fill="#202c32" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="2">NORTHLINE</text>
  <text x="1122" y="82" text-anchor="end" fill="#202c32" font-family="Arial,sans-serif" font-size="14" font-weight="700">A CLEARER WAY FORWARD</text>
  <line x1="78" y1="108" x2="1122" y2="108" stroke="#202c32" stroke-width="2"/>
  <rect x="812" y="167" width="278" height="302" fill="#f0c83c"/>
  <path d="M832 424 L917 225 L1001 424 Z" fill="#e75848" stroke="#202c32" stroke-width="5"/>
  <circle cx="1034" cy="231" r="35" fill="#17847c" stroke="#202c32" stroke-width="4"/>
